[servers]

worker-node-1 ansible_host=YOUR_FIRST_PUBLIC_IP
worker-node-2 ansible_host=YOUR_SECOND_PUBLIC_IP

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
host_key_checking=False

[servers:vars]
ansible_ssh_private_key_file=/home/ubuntu/ansible-master-key


#ansible -i host.ini all -m ping	         Pings all hosts
#ansible -i host.ini servers -m ping	     Pings all hosts in the servers group
#ansible -i host.ini worker-node-1 -m ping	 Pings only worker-node-1
