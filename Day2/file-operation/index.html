<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful HTML Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #f6d365, #fda085);
            background-size: 300% 300%;
            animation: gradientBG 12s ease infinite;
            font-family: system-ui, -apple-system, sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            background: -webkit-linear-gradient(#fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #ffffff;
            font-size: 1.2rem;
            margin: 0;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .color-dots {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .dot {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello, Colors! 🌈</h1>
        <p>This is a simple HTML page with an animated CSS gradient background.</p>
        
        <div class="color-dots">
            <div class="dot" style="background-color: #ff9a9e;"></div>
            <div class="dot" style="background-color: #a1c4fd;"></div>
            <div class="dot" style="background-color: #f6d365;"></div>
            <div class="dot" style="background-color: #fda085;"></div>
        </div>
    </div>
</body>
</html>
