
- name: Show secrets
  hosts: servers
  become: yes

  vars_files:
    - secrets.yml

  tasks:
    - name: Show Password
      debug:
        msg: "My password is {{ password }}"
      no_log: true

    - name: Show API key
      debug:
        msg: "My API key is {{ api_key }}"
      no_log: true


# vars_files: is used to import a file into your playbook.
# {{ password }}: Calls the password variable from the imported secrets.yml file.
# no_log: true: When using credentials in a playbook, always use no_log: true to hide sensitive task output from the logs.
